openapi: 3.0.3
info:
  title: VaultMind — Auth & Users API
  description: |
    Authentication (login / logout / token refresh) and User management
    endpoints for the VaultMind secure vault platform.

    **Auth flow**
    - `POST /auth/login` sets two **httpOnly** cookies: `token` (15 min) and `refreshToken` (7 d).
    - Every protected route reads the `token` cookie automatically.
    - If `token` is expired but `refreshToken` is valid the middleware silently rotates it.
    - `GET /auth/logout` clears both cookies.

    **RBAC**
    | Role  | Notable permissions |
    |-------|---------------------|
    | admin | Read all users, delete any user |
    | user  | Read / update / delete own profile |
    | guest | Register, login only |
  version: "1.0.0"
  contact:
    name: VaultMind API

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Login, logout and token management
  - name: Users
    description: User registration and profile management

# ── Security ──────────────────────────────────────────────────────────────────
# Tokens are transported via httpOnly cookies, not Authorization headers.
# Mark every protected endpoint with the cookieAuth scheme below.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: httpOnly JWT access cookie set by POST /auth/login

  # ── Reusable schemas ────────────────────────────────────────────────────────
  schemas:

    # ── Error ────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Bad Request Exception
        message:
          type: string
          example: Email and password are required
        details:
          type: object
          additionalProperties: true
          example:
            EmailMissing: true

    # ── User (public view — no password) ─────────────────────────────────────
    UserPublic:
      type: object
      properties:
        id:
          type: string
          example: user-1716048000000
        name:
          type: string
          example: Alice Doe
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          type: string
          enum: [admin, user, guest]
          example: user

    # ── Create user request body ──────────────────────────────────────────────
    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          example: Alice Doe
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          minLength: 8
          example: "Str0ng!Pass"

    # ── Update user request body ──────────────────────────────────────────────
    UpdateUserRequest:
      type: object
      description: All fields are optional; supply only what you want to change.
      properties:
        name:
          type: string
          minLength: 1
          example: Alice Smith
        email:
          type: string
          format: email
          example: alice.smith@example.com
        password:
          type: string
          minLength: 8
          description: Provide only to change password; will be re-hashed server-side.
          example: "N3wStr0ng!Pass"
        role:
          type: string
          enum: [admin, user, guest]
          description: Admin-only field.
          example: user

    # ── Login request ─────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          example: "Str0ng!Pass"

  # ── Reusable responses ──────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid access token cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: AuthenticationFailedExpcetion
            message: Authentication Failed.

    Forbidden:
      description: Authenticated but insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: InsufficientPermissionException
            message: You do not have permission to perform this action.

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Not Found Exception
            message: User with id user-xxx not found

    BadRequest:
      description: Validation error — missing or invalid request fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════════════════════════════════════════

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Validates credentials and sets two httpOnly cookies:
        - `token` — short-lived access token (default 15 min)
        - `refreshToken` — long-lived refresh token (default 7 days)

        The middleware automatically rotates `token` using `refreshToken`
        on subsequent requests if the access token has expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valid:
                summary: Valid credentials
                value:
                  email: alice@example.com
                  password: "Str0ng!Pass"
              missingPassword:
                summary: Missing password (triggers 400)
                value:
                  email: alice@example.com
      responses:
        "200":
          description: Login successful — cookies are set in the response.
          headers:
            Set-Cookie:
              description: "Two httpOnly cookies: `token` and `refreshToken`."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          description: Invalid credentials (email not found or wrong password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not Found Exception
                message: Invalid credentials

  /auth/logout:
    get:
      tags: [Auth]
      summary: Logout
      description: Clears both the `token` and `refreshToken` cookies.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logout successful — cookies cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful

  # ════════════════════════════════════════════════════════════════════════════
  # USERS
  # ════════════════════════════════════════════════════════════════════════════

  /users:
    post:
      tags: [Users]
      summary: Register a new user (public)
      description: |
        Creates a new account. No authentication required.
        - Default role: `user`
        - Default tier: `free`
        - Default UI mode: `simple`
        - Password is bcrypt-hashed (12 rounds) before storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              valid:
                summary: Valid registration
                value:
                  name: Alice Doe
                  email: alice@example.com
                  password: "Str0ng!Pass"
              missingName:
                summary: Missing name (triggers 400)
                value:
                  email: alice@example.com
                  password: "Str0ng!Pass"
              invalidEmail:
                summary: Invalid email format (triggers 400)
                value:
                  name: Alice Doe
                  email: not-an-email
                  password: "Str0ng!Pass"
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
              example:
                id: user-1716048000000
                name: Alice Doe
                email: alice@example.com
                role: user
        "400":
          $ref: '#/components/responses/BadRequest'

    get:
      tags: [Users]
      summary: List all users (admin only)
      description: Returns all registered users. Requires `admin` role.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Array of user public profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublic'
              example:
                - id: user-1716048000000
                  name: Alice Doe
                  email: alice@example.com
                  role: user
                - id: user-1716048111111
                  name: Bob Admin
                  email: bob@example.com
                  role: admin
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The unique user ID (e.g. `user-1716048000000`).
        schema:
          type: string
          example: user-1716048000000

    get:
      tags: [Users]
      summary: Get user by ID
      description: |
        Returns a single user's public profile.
        Users can fetch their own profile; admins can fetch any profile.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User public profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
              example:
                id: user-1716048000000
                name: Alice Doe
                email: alice@example.com
                role: user
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update user by ID
      description: |
        Partially updates a user record. All body fields are optional.
        - Providing `password` triggers a fresh bcrypt hash.
        - Only admins may change `role`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              changeName:
                summary: Change display name only
                value:
                  name: Alice Smith
              changePassword:
                summary: Change password
                value:
                  password: "N3wStr0ng!Pass"
              changeRole:
                summary: Promote to admin (admin-only)
                value:
                  role: admin
      responses:
        "200":
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Delete user by ID
      description: Permanently deletes the account. Users can delete their own account; admins can delete any.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Account deleted — no body returned.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'