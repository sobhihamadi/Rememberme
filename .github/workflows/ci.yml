name: "VaultMind CI/CD"

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

env:
  NODE_BACKEND: "18"
  NODE_FRONTEND: "20"

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 1. BUILD BACKEND
  # ══════════════════════════════════════════════════════════════════════════
  build-backend:
    name: "Build · Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_BACKEND }}

      - name: Install dependencies
        run: npm install

      - name: Transpile TypeScript
        env:
          NODE_ENV: production
        run: npm run build

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-backend-${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════════════
  # 2. BUILD FRONTEND
  # ══════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: "Build · Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_FRONTEND }}

      - name: Install frontend dependencies
        working-directory: UI
        run: npm install

      - name: Build Vite app
        working-directory: UI
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Cache dist output
        uses: actions/cache@v4
        with:
          path: UI/dist
          key: ${{ runner.os }}-frontend-${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════════════
  # 3. RELEASE — version bump + GitHub Release (master only)
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: "Release · GitHub"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_BACKEND }}

      - name: Build backend
        env:
          NODE_ENV: production
        run: npm install && npm run build

      - name: Package backend artifact
        run: cd build && zip -r ../backend-artifact.zip .

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_FRONTEND }}

      - name: Build frontend
        working-directory: UI
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm install && npm run build

      - name: Package frontend artifact
        run: cd UI/dist && zip -r ../../frontend-artifact.zip .

      - name: Bump version
        id: version
        uses: phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          major-wording:  "MAJOR"
          minor-wording:  "minor"
          patch-wording:  "patch,fixes"
          commit-message: "CI: Bump Version to {{version}} [skip ci]"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend-artifact.zip
            frontend-artifact.zip
          tag_name:    ${{ steps.version.outputs.newTag }}
          draft:       false
          prerelease:  false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════
  # 4. DEPLOY → Render (master only)
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy · Render"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy backend → Render Web Service
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_BACKEND_HOOK }}" \
            -o /dev/null -w "Backend — HTTP %{http_code}\n"

      - name: Deploy frontend → Render Static Site
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}" \
            -o /dev/null -w "Frontend — HTTP %{http_code}\n"