name: "VaultMind CI/CD"

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

env:
  NODE_VERSION: "18"

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 1. BUILD BACKEND
  # ══════════════════════════════════════════════════════════════════════════
  build-backend:
    name: "Build · Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Transpile TypeScript
        run: npm run build

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-backend-${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════════════
  # 2. BUILD FRONTEND
  # ══════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: "Build · Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: UI
        run: npm install

      - name: Build Vite app
        working-directory: UI
        env:
          # Points the built bundle at your Render backend URL
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Cache dist output
        uses: actions/cache@v4
        with:
          path: UI/dist
          key: ${{ runner.os }}-frontend-${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════════════
  # 3. TEST
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: "Test · Backend"
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Cache coverage
        uses: actions/cache@v4
        with:
          path: coverage
          key: ${{ runner.os }}-coverage-${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════════════
  # 4. LINT
  # ══════════════════════════════════════════════════════════════════════════
  lint:
    name: "Lint · Backend + Frontend"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: npm install

      - name: Lint backend
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: UI
        run: npm install

      - name: Lint frontend
        working-directory: UI
        run: npm run lint

  # ══════════════════════════════════════════════════════════════════════════
  # 5. RELEASE — version bump + GitHub Release (master only)
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: "Release · GitHub"
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & build backend
        run: npm install && npm run build

      - name: Package backend artifact
        run: cd build && zip -r ../backend-artifact.zip .

      - name: Install & build frontend
        working-directory: UI
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm install && npm run build

      - name: Package frontend artifact
        run: cd UI/dist && zip -r ../../frontend-artifact.zip .

      - name: Bump version
        id: version
        uses: phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          major-wording:  "MAJOR"
          minor-wording:  "minor"
          patch-wording:  "patch,fixes"
          commit-message: "CI: Bump Version to {{version}} [skip ci]"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend-artifact.zip
            frontend-artifact.zip
          tag_name:    ${{ steps.version.outputs.newTag }}
          draft:       false
          prerelease:  false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════
  # 6. DEPLOY — both services on Render via deploy hooks (master only)
  #    Render pulls the latest code, builds, and restarts automatically.
  #    Two separate hooks: one for the backend service, one for the static site.
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy · Render (backend + frontend)"
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy backend → Render Web Service
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_BACKEND_HOOK }}" \
            -o /dev/null -w "Backend deploy triggered — HTTP %{http_code}\n"

      - name: Deploy frontend → Render Static Site
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}" \
            -o /dev/null -w "Frontend deploy triggered — HTTP %{http_code}\n"